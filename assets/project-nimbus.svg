<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Level 1-3: NIMBUS. A weather site where the sky comes alive: rain slants with the real wind, storms flash, clear nights twinkle. 24-hour chart, 5-day forecast, air quality and an interactive weather map." shape-rendering="crispEdges">
