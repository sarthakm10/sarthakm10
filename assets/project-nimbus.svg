    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#000" fill-opacity=".22"/></pattern>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
    <radialGradient id="crt" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#3A2A7A" stop-opacity=".45"/><stop offset="1" stop-color="#3A2A7A" stop-opacity="0"/></radialGradient><style>
      .mono{font-family:ui-monospace,'SFMono-Regular','Cascadia Code',Consolas,'Liberation Mono',monospace}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .march{animation:march 4s steps(8) infinite alternate}
      @keyframes march{from{transform:translateX(0)}to{transform:translateX(120px)}}
      .f1{animation:fa 1s steps(1) infinite} .f2{animation:fb 1s steps(1) infinite}
      @keyframes fa{0%{opacity:1}50%{opacity:0}} @keyframes fb{0%{opacity:0}50%{opacity:1}}
      .bob{animation:bob .8s steps(2) infinite}
      @keyframes bob{50%{transform:translateY(-6px)}}
      .spin{transform-box:fill-box;transform-origin:center;animation:spin 1.2s steps(6) infinite}
      @keyframes spin{0%{transform:scaleX(1)}50%{transform:scaleX(.15)}100%{transform:scaleX(1)}}
      .fall{animation:fall 6s linear infinite}
      @keyframes fall{from{transform:translateY(-40px)}to{transform:translateY(460px)}}
      .pop{opacity:0;animation:pop .01s steps(1) forwards}
      @keyframes pop{to{opacity:1}}
      .flick{animation:flick 6s steps(1) infinite}
      @keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.6}98%{opacity:1}99%{opacity:.7}}
</style></defs>
