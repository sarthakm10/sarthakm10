<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Level 1-2: SHELFWISE. A library system with issue/return, renewals, hold queues and automatic late fines. Transactional stock updates so the last copy can't be issued twice. JWT, bcrypt, RBAC and an admin dashboard." shape-rendering="crispEdges">
